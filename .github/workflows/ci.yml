name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run check:types
      - run: bun run test
      - run: bun run build
      - run: bun run check:package
      # tarball must ship only dist + LICENSE/README/package.json
      - name: assert tarball contents
        run: |
          set -euo pipefail
          bad=0
          while IFS= read -r f; do
            case "$f" in
              dist/*|LICENSE|README.md|package.json) ;;
              *) echo "UNEXPECTED: $f"; bad=1 ;;
            esac
          done < <(npm pack --dry-run --json 2>/dev/null | sed -n '/^\[/,$p' | jq -r '.[0].files[].path')
          exit $bad

  # release-please builds the changelog from squash-merge titles, so the PR title must be a conventional commit.
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: echo "$PR_TITLE" | bunx commitlint
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
